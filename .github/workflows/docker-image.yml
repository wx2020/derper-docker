name: Docker Image

on:
  schedule:
    # Runs "every Monday" (see https://crontab.guru)
    - cron: '0 0 * * MON'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get latest tailscale version
        run: |
          TAILSCALE_VERSION=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r '.tag_name')
          echo "Latest tailscale version: $TAILSCALE_VERSION"
          echo TAILSCALE_VERSION=$TAILSCALE_VERSION >> $GITHUB_ENV

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if the image exists
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/derper:${{ env.TAILSCALE_VERSION }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE already exists, skip build."
            echo IMAGE_EXISTS=true >> $GITHUB_ENV
          else
            echo "Image $IMAGE does not exist, need build."
            echo IMAGE_EXISTS=false >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/derper:${{ env.TAILSCALE_VERSION }}
            ghcr.io/${{ github.repository_owner }}/derper:latest
          build-args: |
            DERP_VERSION=${{ env.TAILSCALE_VERSION }}

      - name: Set up Go
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build derper binary (linux/amd64)
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 GOBIN="$PWD/bin" go install "tailscale.com/cmd/derper@${{ env.TAILSCALE_VERSION }}"
          gzip -9 -c "bin/derper" > "derper-${{ env.TAILSCALE_VERSION }}-linux-amd64.gz"
          ls -lh "derper-${{ env.TAILSCALE_VERSION }}-linux-amd64.gz"

      - name: Publish binary to Release
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAILSCALE_VERSION }}
          name: ${{ env.TAILSCALE_VERSION }}
          body: ""
          files: derper-${{ env.TAILSCALE_VERSION }}-linux-amd64.gz
